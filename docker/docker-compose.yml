# Compose 工程名：Docker Desktop / docker compose ls 中显示为 ls-aegis
# 容器默认命名：ls-aegis-<服务名>-1（不要写死 container_name，否则会脱离项目分组）
# 密钥请放 docker/.env（已 gitignore），模板见 docker/.env.example
name: ls-aegis

services:
  mysql:
    image: mysql:8.0.42
    restart: always
    ports:
      # 仅绑定本机，避免数据库端口对局域网暴露
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ls_aegis
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    networks:
      - net
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2.8
    restart: always
    ports:
      # 仅绑定本机；容器内仍 bind 0.0.0.0 供 compose 网络互访
      - '127.0.0.1:6379:6379'
    volumes:
      - ./redis/conf/redis.conf:/usr/local/redis/config/redis.conf
      - redis-data:/data
    environment:
      TZ: Asia/Shanghai
      REDIS_PWD: ${REDIS_PWD}
    # 口令由环境变量注入，禁止在 conf 写死弱口令
    command: 'redis-server /usr/local/redis/config/redis.conf --appendonly yes --requirepass ${REDIS_PWD}'
    networks:
      - net
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PWD" ping']
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ./ls-aegis-server
    restart: always
    ports:
      - '18000:18000'
      - '1789:1789'
    volumes:
      - ./data/ls-aegis-server/config/:/app/config/
      - ./data/ls-aegis-server/data/file/:/app/data/file/
      # 国密密钥持久化，避免重建容器后密钥变更导致邮箱/手机等密文无法解密与按密文查询
      - ./data/ls-aegis-server/data/gm/:/app/data/gm/
      - ./data/ls-aegis-server/logs/:/app/logs/
    environment:
      TZ: Asia/Shanghai
      APPLICATION_URL: ${APPLICATION_URL:-http://localhost:8080}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PWD: ${DB_PWD}
      DB_NAME: ls_aegis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PWD: ${REDIS_PWD}
      REDIS_DB: 0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENCRYPT_AES_PASSWORD: ${ENCRYPT_AES_PASSWORD:-}
      ENCRYPT_RSA_PUBLIC_KEY: ${ENCRYPT_RSA_PUBLIC_KEY:-}
      ENCRYPT_RSA_PRIVATE_KEY: ${ENCRYPT_RSA_PRIVATE_KEY:-}
      # 与挂载目录一致，禁止落在容器可写层导致重建丢钥
      GM_KEY_STORE_PATH: ${GM_KEY_STORE_PATH:-/app/data/gm/keys.properties}
      SNAIL_JOB_ENABLED: ${SNAIL_JOB_ENABLED:-false}
      SNAIL_JOB_URL: ${SNAIL_JOB_URL:-http://127.0.0.1:8001/snail-job}
      SCHEDULE_TOKEN: ${SCHEDULE_TOKEN:-}
      SCHEDULE_USERNAME: ${SCHEDULE_USERNAME:-}
      SCHEDULE_PASSWORD: ${SCHEDULE_PASSWORD:-}
      JUSTAUTH_ENABLED: ${JUSTAUTH_ENABLED:-false}
      # 与 application.yml 一致：关闭多租户
      CONTINEW_STARTER_TENANT_ENABLED: 'false'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - net

  web:
    image: nginx:1.27.0
    restart: always
    ports:
      - '8080:80'
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/web/:/usr/share/nginx/html/
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - server
    networks:
      - net

volumes:
  mysql-data:
  redis-data:

networks:
  net:
    name: ls-aegis-net
