worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    # 限制 body 大小
    client_max_body_size 100m;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # 后端服务（Compose 服务名 / 容器名：ls-aegis-server）
    upstream admin-server {
        ip_hash;
        server ls-aegis-server:18000;
    }

    # 前端项目（静态页面 + /api/ 反向代理到后端）
    server {
        listen       80;
        server_name  localhost _;

        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;
        }

        # /api/ 代理到后端（如果使用 /api/ 前缀代理而不使用 api 域名提供后端服务，可放开此配置）
        location /api/ {
            proxy_pass http://admin-server/;
            proxy_ignore_client_abort on;
            proxy_http_version 1.1;

            # Proxy headers
            # 同源反代：屏蔽 Origin，避免后端 CORS 校验拒绝（后端白名单仅含生产域名）
            proxy_set_header Origin        "";
            proxy_set_header Upgrade       $http_upgrade;
            proxy_set_header Connection    "Upgrade";
            proxy_set_header Host          $host;
            proxy_set_header X-Real-IP     $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket 通知推送反代（通知中心）
        location /websocket {
            proxy_pass http://admin-server;
            proxy_http_version 1.1;
            proxy_set_header Origin           "";
            proxy_set_header Upgrade          $http_upgrade;
            proxy_set_header Connection       "Upgrade";
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
